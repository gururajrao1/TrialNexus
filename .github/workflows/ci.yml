name: trialnexus-ci

on:
  push:
    branches: [main, mvp]
  pull_request:
    branches: [main, mvp]

jobs:
  build:
    # Pinned: ubuntu-latest migrated to Ubuntu 26, whose apt names break
    # Playwright's install-deps. Revisit when Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Install lint tooling
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check backend tests seed_data.py
      - name: Ruff format check
        run: ruff format --check backend tests seed_data.py
      - name: Seed database
        run: python seed_data.py
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Live end-to-end checks
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          python tests/test_e2e_live.py
          STATUS=$?
          kill $SERVER_PID
          exit $STATUS
      - name: Frontend smoke (skips on branches without JS modules)
        run: |
          if [ -f frontend/js/boot.js ]; then node tests/test_ui_smoke.mjs; else echo "no JS modules on this branch"; fi
      - name: Install Chromium
        run: |
          if [ ! -f frontend/js/boot.js ]; then echo "no full UI on this branch"; exit 0; fi
          python -m playwright install chromium
      - name: Install browser system deps
        run: |
          if [ ! -f frontend/js/boot.js ]; then echo "no full UI on this branch"; exit 0; fi
          # Absolute interpreter: bare `sudo python` loses the setup-python
          # PATH (secure_path) and can't find the playwright module.
          sudo "$(which python)" -m playwright install-deps chromium
      - name: Browser pixel check (main UI only)
        run: |
          if [ ! -f frontend/js/boot.js ]; then echo "no full UI on this branch"; exit 0; fi
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          set +e
          TRIALNEXUS_BROWSER_TEST=1 python -m unittest tests.test_ui_pixel -v > /tmp/pixel.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/pixel.log
          kill $SERVER_PID || true
          if [ $STATUS -ne 0 ]; then
            echo "::error::pixel-failed::$(tail -c 2500 /tmp/pixel.log | tr '\n' ' ')"
          fi
          exit $STATUS
      - name: Upload pixel proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-proof
          path: ${{ runner.temp }}/pixel_proof.png
          if-no-files-found: ignore
      - name: Core parity between main and mvp
        run: |
          git rev-parse --verify origin/mvp >/dev/null 2>&1 || { echo "no mvp branch yet"; exit 0; }
          for f in \
            backend/agents/protocol_auditor.py \
            backend/agents/site_scout.py \
            backend/agents/cohort_matcher.py \
            backend/agents/safety_triage.py \
            backend/agents/synonyms.py \
            backend/database.py \
            seed_data.py; do
            blob=$(git rev-parse "origin/mvp:$f")
            if git log --format=%H origin/main -- "$f" | while read c; do git rev-parse "$c:$f"; done | grep -qx "$blob"; then
              echo "OK: $f matches a main version"
            else
              echo "DIVERGED: $f on mvp matches no version on main"; exit 1
            fi
          done
